name: Security Scan

on:
  workflow_call:
  schedule:
    - cron: '0 18 * * *'   # daily 18:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install project
        run: uv sync --dev

      - name: MCP scan (yara)
        env:
          POLARION_URL: https://example.invalid
          POLARION_TOKEN: dummy
        run: |
          set -o pipefail
          uv tool run --python 3.13 --from cisco-ai-mcp-scanner mcp-scanner \
            --analyzers yara --format raw --log-level error \
            stdio --stdio-command uv \
                  --stdio-arg run --stdio-arg mcp-server-polarion \
            | tee scan-result.json

      - name: Summarize findings
        if: always()
        run: |
          python3 .github/scripts/mcp_scan_summary.py
          cat scan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s scan-summary.md || exit 0
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file scan-summary.md --edit-last --create-if-none

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-scan-report
          path: scan-result.json
          retention-days: 30
          if-no-files-found: warn

  audit:
    # PR: fail only on CVEs head add over base (absolute gate deadlocked two CVE-fix PRs,
    # each red on the other's CVE). push/schedule: no base = full audit, main's CVEs stay red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Export production-only requirements
        # Wheel deps only; --no-hashes since OSV's pip parser can't read multiline hashes.
        run: |
          export_reqs() {
            uv export --directory "$1" --no-dev --no-emit-project --no-hashes \
              --format requirements-txt > "$2"
          }
          export_reqs . runtime-requirements.txt
          if [ -d base ]; then export_reqs base base-requirements.txt; fi

      - name: Scan dependencies for known CVEs (osv-scanner)
        # --no-resolve: export already = full pinned closure; deps.dev re-resolve add nothing,
        # and exit 127 on any version deps.dev not yet indexed (fresh PyPI release).
        # Exit 1 = vulns found (gated next step); any other non-zero = scanner broke, fail closed.
        run: |
          curl -sSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          chmod +x osv-scanner
          scan() {
            rc=0
            ./osv-scanner scan source --no-resolve --format json \
              --lockfile="requirements.txt:$1" > "$2" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error title=osv-scanner::exit $rc scanning $1"
              exit "$rc"
            fi
          }
          scan runtime-requirements.txt osv-head.json
          if [ -f base-requirements.txt ]; then scan base-requirements.txt osv-base.json; fi

      - name: Gate on vulnerabilities
        run: |
          base_args=()
          if [ -f osv-base.json ]; then base_args=(--base osv-base.json); fi
          python3 .github/scripts/osv_audit_diff.py osv-head.json "${base_args[@]}"

      - name: Summarize audit
        if: always()
        run: if [ -f osv-summary.md ]; then cat osv-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-scan-report
          path: |
            osv-head.json
            osv-base.json
            osv-summary.md
          retention-days: 30
          if-no-files-found: warn
